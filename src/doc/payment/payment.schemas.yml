components:
  schemas:
    CreatePaymentRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, example: Efectivo }
        type: { type: string, enum: [cash, card, yape, plin, example], example: cash }
    UpdatePaymentRequest:
      type: object
      required: [name]
      properties: { name: { type: string, example: Tarjeta } }
    Payment:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Efectivo }
        type: { type: string, enum: [cash, card, yape, plin, example], example: cash }
        status: { type: boolean, example: true }
    PaymentListResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data:
          type: object
          properties:
            total: { type: integer, example: 4 }
            items: { type: array, items: { $ref: '#/components/schemas/Payment' } }
    PaymentResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data: { $ref: '#/components/schemas/Payment' }
