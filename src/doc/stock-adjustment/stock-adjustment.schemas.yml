components:
  schemas:
    StockAdjustmentItemRequest:
      type: object
      required: [product_id, qty]
      properties:
        product_id: { type: integer, example: 1 }
        qty: { type: number, example: 5 }
    CreateStockAdjustmentRequest:
      type: object
      required: [reason_id, items]
      properties:
        reason_id: { type: integer, example: 2 }
        items: { type: array, items: { $ref: '#/components/schemas/StockAdjustmentItemRequest' } }
        notes: { type: string, example: Ajuste por conteo fisico }
    UpdateStockAdjustmentRequest:
      type: object
      properties:
        reason_id: { type: integer, example: 2 }
        items: { type: array, items: { $ref: '#/components/schemas/StockAdjustmentItemRequest' } }
        notes: { type: string, example: Correccion de inventario }
    StockAdjustment:
      type: object
      properties:
        id: { type: integer, example: 1 }
        status: { type: string, example: DRAFT }
        reason_id: { type: integer, example: 2 }
        notes: { type: string, nullable: true, example: Ajuste por conteo fisico }
        items: { type: array, items: { $ref: '#/components/schemas/StockAdjustmentItemRequest' } }
    StockAdjustmentListResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data: { type: object, properties: { total: { type: integer, example: 8 }, items: { type: array, items: { $ref: '#/components/schemas/StockAdjustment' } } } }
    StockAdjustmentResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data: { $ref: '#/components/schemas/StockAdjustment' }
