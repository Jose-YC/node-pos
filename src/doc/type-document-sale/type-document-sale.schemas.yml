components:
  schemas:
    TypeDocumentSale:
      type: object
      properties:
        id: { type: string, example: BOLETA }
        name: { type: string, example: Boleta de venta }
    TypeDocumentSaleStatus:
      allOf:
        - $ref: '#/components/schemas/TypeDocumentSale'
        - type: object
          properties: { status: { type: boolean, example: true } }
    TypeDocumentSaleListResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data: { type: array, items: { $ref: '#/components/schemas/TypeDocumentSale' } }
    TypeDocumentSaleStatusResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data: { type: array, items: { $ref: '#/components/schemas/TypeDocumentSaleStatus' } }
