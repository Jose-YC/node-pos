components:
  schemas:
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Bebidas }
        description: { type: string, example: Productos liquidos }
    UpdateCategoryRequest:
      type: object
      properties:
        name: { type: string, example: Alimentos }
        description: { type: string, example: Productos de alimentacion }
    Category:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Bebidas }
        description: { type: string, nullable: true, example: Productos liquidos }
    CategoryListResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data:
          type: object
          properties:
            total: { type: integer, example: 20 }
            items: { type: array, items: { $ref: '#/components/schemas/Category' } }
    CategoryResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data: { $ref: '#/components/schemas/Category' }
