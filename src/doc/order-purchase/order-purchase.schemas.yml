components:
  schemas:
    OrderPurchaseItemRequest:
      type: object
      required: [product_id, qty, price]
      properties:
        product_id: { type: integer, example: 1 }
        qty: { type: number, example: 10 }
        price: { type: number, example: 12.5 }
    OrderPurchaseItem:
      type: object
      properties:
        product_id: { type: integer, example: 1 }
        product_name: { type: string, example: Cafe molido }
        qty_received: { type: number, example: 0 }
        qty: { type: number, example: 10 }
        price: { type: number, example: 12.5 }
        subtotal: { type: number, example: 125 }
    CreateOrderPurchaseRequest:
      type: object
      required: [supplier_id, address, delivery_date, items]
      properties:
        supplier_id: { type: integer, example: 1 }
        address: { type: string, example: Av. Central 123 }
        delivery_date: { type: string, format: date-time, example: '2026-09-15T00:00:00.000Z' }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OrderPurchaseItemRequest' } }
    UpdateOrderPurchaseRequest:
      type: object
      properties:
        supplier_id: { type: integer, example: 1 }
        address: { type: string, example: Av. Norte 456 }
        delivery_date: { type: string, format: date-time, example: '2026-09-20T00:00:00.000Z' }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OrderPurchaseItemRequest' } }
    OrderPurchase:
      type: object
      properties:
        id: { type: integer, example: 1 }
        status: { type: string, example: DRAFT }
        supplier_id: { type: integer, example: 1 }
        supplier_name: { type: string, example: Distribuidora Central }
        address: { type: string, example: Av. Central 123 }
        delivery_date: { type: string, format: date-time, example: '2026-09-15T00:00:00.000Z' }
        total: { type: number, example: 1250 }
        items: { type: array, items: { $ref: '#/components/schemas/OrderPurchaseItem' } }
    OrderPurchaseListResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data: { type: object, properties: { total: { type: integer, example: 10 }, items: { type: array, items: { $ref: '#/components/schemas/OrderPurchase' } } } }
    OrderPurchaseResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data: { $ref: '#/components/schemas/OrderPurchase' }
