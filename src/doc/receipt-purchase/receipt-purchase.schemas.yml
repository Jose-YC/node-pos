components:
  schemas:
    ReceiptPurchaseItemRequest:
      type: object
      required: [product_id, qty_received, qty_reject]
      properties:
        product_id: { type: integer, example: 1 }
        qty_received: { type: integer, minimum: 1, example: 10 }
        qty_reject:
          type: integer
          minimum: 0
          description: Debe ser menor que qty_received.
          example: 1
    CreateReceiptPurchaseRequest:
      type: object
      required: [purchase_id, items]
      properties:
        purchase_id: { type: integer, minimum: 1, example: 1 }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ReceiptPurchaseItemRequest' } }
    UpdateReceiptPurchaseRequest:
      type: object
      required: [items]
      properties: { items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ReceiptPurchaseItemRequest' } } }
    ReceiptPurchaseItem:
      type: object
      properties:
        product_id: { type: integer, example: 1 }
        product_name: { type: string, example: Cafe molido }
        qty_order: { type: integer, example: 10 }
        qty_received: { type: integer, example: 10 }
        qty_reject: { type: integer, example: 1 }
        qty_accepted: { type: integer, example: 9 }
        price: { type: number, example: 12.5 }
        subtotal: { type: number, example: 112.5 }
    ReceiptPurchase:
      type: object
      properties:
        id: { type: integer, example: 1 }
        serie: { type: string, example: GR-000001 }
        status: { type: string, example: RECEIVED }
        supplier_id: { type: integer, example: 1 }
        supplier_ruc: { type: string, example: '20514680401' }
        supplier_name: { type: string, example: Distribuidora Central }
        date_receipt: { type: string, format: date-time, example: '2026-09-09T12:00:00.000Z' }
        items: { type: array, items: { $ref: '#/components/schemas/ReceiptPurchaseItem' } }
    ReceiptPurchaseListResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data: { type: object, properties: { total: { type: integer, example: 10 }, items: { type: array, items: { $ref: '#/components/schemas/ReceiptPurchase' } } } }
    ReceiptPurchaseResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: ok }
        data: { $ref: '#/components/schemas/ReceiptPurchase' }
